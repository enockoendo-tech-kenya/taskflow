<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — Vanilla JS & Tailwind CSS Task Manager</title>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          animation: {
            'pop': 'pop 0.3s cubic-bezier(0.16, 1, 0.3, 1)',
            'slide-in': 'slideIn 0.25s ease-out forwards',
          },
          keyframes: {
            pop: {
              '0%': { transform: 'scale(0.85)' },
              '50%': { transform: 'scale(1.15)' },
              '100%': { transform: 'scale(1)' },
            },
            slideIn: {
              '0%': { opacity: '0', transform: 'translateY(8px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>

  <!-- Custom Transition & Scrollbar Styles -->
  <style>
    .item-removing {
      opacity: 0 !important;
      transform: translateX(16px) scale(0.98) !important;
      transition: all 220ms cubic-bezier(0.4, 0, 0.2, 1) !important;
    }
    .todo-item {
      transition: all 250ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Custom subtle scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.3);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.5);
    }
  </style>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300 selection:bg-indigo-500 selection:text-white relative overflow-x-hidden">

  <!-- Ambient Decorative Background Glows -->
  <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
    <div class="absolute -top-32 -left-32 w-96 h-96 rounded-full bg-indigo-500/15 dark:bg-indigo-500/20 blur-3xl"></div>
    <div class="absolute top-1/3 -right-32 w-96 h-96 rounded-full bg-violet-500/15 dark:bg-fuchsia-500/15 blur-3xl"></div>
    <div class="absolute -bottom-32 left-1/3 w-96 h-96 rounded-full bg-sky-500/15 dark:bg-cyan-500/15 blur-3xl"></div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Main App Container -->
  <main class="max-w-3xl mx-auto px-4 sm:px-6 py-8 sm:py-12">
    
    <!-- Header Section -->
    <header class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
      <div class="flex items-center gap-3.5">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-indigo-500 via-violet-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/25 text-white">
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight bg-gradient-to-r from-slate-900 to-slate-600 dark:from-white dark:to-slate-300 bg-clip-text text-transparent">
              TaskFlow
            </h1>
            <span class="px-2 py-0.5 text-[11px] font-semibold uppercase tracking-wider rounded-full bg-indigo-500/10 text-indigo-600 dark:bg-indigo-400/15 dark:text-indigo-300 border border-indigo-500/20">
              Vanilla JS + Tailwind
            </span>
          </div>
          <p class="text-sm text-slate-500 dark:text-slate-400 mt-0.5">
            Fast, zero-dependency task management stored locally.
          </p>
        </div>
      </div>

      <!-- Header Controls: Reset Demo Data & Theme Toggle -->
      <div class="flex items-center gap-2 self-start sm:self-auto">
        <button 
          id="reset-demo-btn"
          type="button"
          title="Restore sample tasks"
          class="px-3 py-2 text-xs font-medium rounded-xl bg-white/80 dark:bg-slate-900/80 hover:bg-white dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200/80 dark:border-slate-800 shadow-sm transition-all flex items-center gap-1.5 backdrop-blur-md cursor-pointer">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          <span>Demo Data</span>
        </button>

        <button 
          id="theme-toggle" 
          type="button"
          aria-label="Toggle Dark Mode"
          class="p-2.5 rounded-xl bg-white/80 dark:bg-slate-900/80 hover:bg-white dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200/80 dark:border-slate-800 shadow-sm transition-all backdrop-blur-md cursor-pointer">
          <!-- Sun Icon (shown in dark mode) -->
          <svg id="sun-icon" class="w-4 h-4 hidden dark:block text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
          <!-- Moon Icon (shown in light mode) -->
          <svg id="moon-icon" class="w-4 h-4 block dark:hidden text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Progress & Stats Card -->
    <section id="progress-widget" class="mb-6 p-5 rounded-2xl bg-white/80 dark:bg-slate-900/70 backdrop-blur-xl border border-slate-200/80 dark:border-slate-800/80 shadow-sm">
      <div class="flex items-center justify-between mb-2.5">
        <div class="flex items-center gap-2">
          <span class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Overall Completion</span>
          <span id="completion-badge" class="px-2 py-0.5 text-xs font-bold rounded-full bg-emerald-500/10 text-emerald-600 dark:text-emerald-400">
            0%
          </span>
        </div>
        <span id="task-counter" class="text-xs font-medium text-slate-500 dark:text-slate-400">
          0 of 0 tasks completed
        </span>
      </div>
      <div class="w-full h-2.5 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
        <div id="progress-bar-fill" class="h-full bg-gradient-to-r from-indigo-500 via-violet-500 to-emerald-500 rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
      </div>
    </section>

    <!-- Task Creation Form -->
    <section class="mb-6 p-4 sm:p-5 rounded-2xl bg-white/90 dark:bg-slate-900/80 backdrop-blur-xl border border-slate-200/80 dark:border-slate-800/80 shadow-lg shadow-slate-200/40 dark:shadow-none">
      <form id="new-todo-form" class="space-y-3.5">
        
        <!-- Primary Input Row -->
        <div class="flex flex-col sm:flex-row gap-2.5">
          <div class="relative flex-1">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
              </svg>
            </div>
            <input 
              id="new-title"
              type="text" 
              name="title" 
              required
              autocomplete="off"
              placeholder="What needs to be done?" 
              class="w-full pl-10 pr-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-950/60 border border-slate-200 dark:border-slate-800 text-sm text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all"
            />
          </div>

          <button 
            type="submit"
            class="px-5 py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 active:scale-[0.98] text-white font-semibold text-sm shadow-md shadow-indigo-500/25 transition-all flex items-center justify-center gap-2 shrink-0 cursor-pointer">
            <span>Add Task</span>
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6" />
            </svg>
          </button>
        </div>

        <!-- Metadata Controls Row (Priority, Category, Due Date) -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 pt-1">
          <!-- Priority Select -->
          <div class="relative">
            <label for="new-priority" class="block text-[11px] font-medium text-slate-400 mb-1 ml-1">Priority</label>
            <select 
              id="new-priority"
              name="priority" 
              class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-950/60 border border-slate-200 dark:border-slate-800 text-xs font-medium text-slate-700 dark:text-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all">
              <option value="Medium" selected>🟡 Medium Priority</option>
              <option value="High">🔴 High Priority</option>
              <option value="Low">🔵 Low Priority</option>
            </select>
          </div>

          <!-- Category Select -->
          <div class="relative">
            <label for="new-category" class="block text-[11px] font-medium text-slate-400 mb-1 ml-1">Category</label>
            <select 
              id="new-category"
              name="category" 
              class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-950/60 border border-slate-200 dark:border-slate-800 text-xs font-medium text-slate-700 dark:text-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all">
              <option value="Work" selected>💼 Work</option>
              <option value="Design">🎨 Design</option>
              <option value="Personal">🏠 Personal</option>
              <option value="Urgent">⚡ Urgent</option>
            </select>
          </div>

          <!-- Due Date Input -->
          <div class="relative">
            <label for="new-due-date" class="block text-[11px] font-medium text-slate-400 mb-1 ml-1">Due Date</label>
            <input 
              id="new-due-date"
              type="date" 
              name="dueDate" 
              class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-950/60 border border-slate-200 dark:border-slate-800 text-xs font-medium text-slate-700 dark:text-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all"
            />
          </div>
        </div>
      </form>
    </section>

    <!-- Search, Filter Tabs & Bulk Actions Bar -->
    <section class="mb-4 space-y-3">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
        
        <!-- Filter Tabs -->
        <div id="filter-tabs" class="inline-flex p-1 rounded-xl bg-slate-200/70 dark:bg-slate-900/90 border border-slate-200/80 dark:border-slate-800 overflow-x-auto max-w-full">
          <button 
            type="button"
            data-filter="all"
            class="filter-tab px-3 py-1.5 rounded-lg text-xs font-semibold transition-all whitespace-nowrap bg-white dark:bg-slate-800 text-indigo-600 dark:text-indigo-400 shadow-sm cursor-pointer">
            All
          </button>
          <button 
            type="button"
            data-filter="active"
            class="filter-tab px-3 py-1.5 rounded-lg text-xs font-medium text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all whitespace-nowrap cursor-pointer">
            Active
          </button>
          <button 
            type="button"
            data-filter="completed"
            class="filter-tab px-3 py-1.5 rounded-lg text-xs font-medium text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all whitespace-nowrap cursor-pointer">
            Completed
          </button>
          <button 
            type="button"
            data-filter="high"
            class="filter-tab px-3 py-1.5 rounded-lg text-xs font-medium text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all whitespace-nowrap cursor-pointer">
            High Priority
          </button>
        </div>

        <!-- Live Search Bar -->
        <div class="relative flex-1 md:max-w-xs">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </div>
          <input 
            id="search-input"
            type="search" 
            name="q" 
            placeholder="Search tasks..." 
            class="w-full pl-9 pr-3 py-2 rounded-xl bg-white/80 dark:bg-slate-900/80 border border-slate-200/80 dark:border-slate-800 text-xs text-slate-800 dark:text-slate-200 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all backdrop-blur-md"
          />
        </div>
      </div>
    </section>

    <!-- Task List Container -->
    <section aria-label="Task List">
      <div id="todo-list" class="space-y-2.5 min-h-[200px]"></div>
    </section>

    <!-- Footer Actions -->
    <footer id="list-footer" class="mt-6 pt-4 border-t border-slate-200/80 dark:border-slate-800/80 flex flex-wrap items-center justify-between gap-3 text-xs text-slate-500 dark:text-slate-400">
      <div class="flex items-center gap-2">
        <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span>Vanilla JS Local Storage Engine Active</span>
      </div>
      
      <button 
        id="clear-completed-btn"
        type="button"
        class="px-3 py-1.5 rounded-lg font-medium text-rose-600 dark:text-rose-400 hover:bg-rose-500/10 transition-all flex items-center gap-1.5 cursor-pointer">
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
        <span>Clear Completed</span>
      </button>
    </footer>
  </main>

  <!-- ===================================================================== -->
  <!-- VANILLA JAVASCRIPT APPLICATION LOGIC                                  -->
  <!-- ===================================================================== -->
  <script>
    (function () {
      const STORAGE_KEY = 'taskflow_vanilla_todos_v1';

      // Application State
      let todos = [];
      let currentFilter = 'all';
      let currentSearch = '';
      let editingId = null;

      // DOM References
      const todoListEl = document.getElementById('todo-list');
      const newTodoForm = document.getElementById('new-todo-form');
      const searchInput = document.getElementById('search-input');
      const filterTabsContainer = document.getElementById('filter-tabs');
      const clearCompletedBtn = document.getElementById('clear-completed-btn');
      const resetDemoBtn = document.getElementById('reset-demo-btn');
      const completionBadge = document.getElementById('completion-badge');
      const taskCounter = document.getElementById('task-counter');
      const progressBarFill = document.getElementById('progress-bar-fill');
      const toastContainer = document.getElementById('toast-container');
      const themeToggleBtn = document.getElementById('theme-toggle');

      // Default Sample Tasks
      function getDefaultTodos() {
        const today = new Date().toISOString().split('T')[0];
        const tomorrow = new Date(Date.now() + 86400000).toISOString().split('T')[0];
        const nextWeek = new Date(Date.now() + 86400000 * 4).toISOString().split('T')[0];

        return [
          {
            id: 'todo-' + (Date.now() - 4000),
            title: 'Finalize Q4 product design system & Tailwind tokens',
            priority: 'High',
            category: 'Design',
            dueDate: today,
            completed: false,
            createdAt: Date.now() - 4000
          },
          {
            id: 'todo-' + (Date.now() - 3000),
            title: 'Build zero-dependency state manager with localStorage sync',
            priority: 'High',
            category: 'Work',
            dueDate: tomorrow,
            completed: true,
            createdAt: Date.now() - 3000
          },
          {
            id: 'todo-' + (Date.now() - 2000),
            title: 'Review client API latency benchmarks before sprint demo',
            priority: 'Medium',
            category: 'Urgent',
            dueDate: tomorrow,
            completed: false,
            createdAt: Date.now() - 2000
          },
          {
            id: 'todo-' + (Date.now() - 1000),
            title: 'Book weekend coffee tasting & architecture walk',
            priority: 'Low',
            category: 'Personal',
            dueDate: nextWeek,
            completed: false,
            createdAt: Date.now() - 1000
          }
        ];
      }

      // Persistence Helpers
      function loadTodos() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            const initial = getDefaultTodos();
            saveTodos(initial);
            return initial;
          }
          return JSON.parse(raw);
        } catch (e) {
          return getDefaultTodos();
        }
      }

      function saveTodos(data = todos) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        } catch (e) {
          console.error('Failed to save to localStorage', e);
        }
      }

      // Security: Escape HTML strings
      function escapeHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      // Date Formatting & Overdue Detection
      function formatDueDate(dateStr) {
        if (!dateStr) return '';
        const todayStr = new Date().toISOString().split('T')[0];
        const tomorrowStr = new Date(Date.now() + 86400000).toISOString().split('T')[0];

        if (dateStr === todayStr) return 'Today';
        if (dateStr === tomorrowStr) return 'Tomorrow';

        const [year, month, day] = dateStr.split('-');
        const dateObj = new Date(year, month - 1, day);
        return dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      }

      function isOverdue(dateStr, completed) {
        if (!dateStr || completed) return false;
        const todayStr = new Date().toISOString().split('T')[0];
        return dateStr < todayStr;
      }

      // Badge Renderers
      function getPriorityBadge(priority) {
        const styles = {
          High: 'bg-rose-500/10 text-rose-600 dark:bg-rose-500/15 dark:text-rose-400 border-rose-500/20',
          Medium: 'bg-amber-500/10 text-amber-600 dark:bg-amber-500/15 dark:text-amber-400 border-amber-500/20',
          Low: 'bg-sky-500/10 text-sky-600 dark:bg-sky-500/15 dark:text-sky-400 border-sky-500/20'
        };
        const dots = {
          High: 'bg-rose-500',
          Medium: 'bg-amber-500',
          Low: 'bg-sky-500'
        };
        const p = styles[priority] ? priority : 'Medium';
        return `
          <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold border ${styles[p]}">
            <span class="w-1.5 h-1.5 rounded-full ${dots[p]}"></span>
            ${escapeHtml(p)}
          </span>
        `;
      }

      function getCategoryBadge(category) {
        const styles = {
          Work: 'bg-indigo-500/10 text-indigo-600 dark:bg-indigo-400/15 dark:text-indigo-300',
          Design: 'bg-fuchsia-500/10 text-fuchsia-600 dark:bg-fuchsia-400/15 dark:text-fuchsia-300',
          Personal: 'bg-emerald-500/10 text-emerald-600 dark:bg-emerald-400/15 dark:text-emerald-300',
          Urgent: 'bg-orange-500/10 text-orange-600 dark:bg-orange-400/15 dark:text-orange-300'
        };
        const c = styles[category] ? category : 'Work';
        return `
          <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-medium ${styles[c]}">
            ${escapeHtml(category)}
          </span>
        `;
      }

      // Toast Notification Helper
      function showToast(message) {
        const toastEl = document.createElement('div');
        toastEl.className = 'animate-slide-in pointer-events-auto flex items-center gap-2.5 px-4 py-2.5 rounded-xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 text-xs font-medium shadow-xl border border-slate-700/50 dark:border-slate-200';
        toastEl.innerHTML = `
          <span class="w-2 h-2 rounded-full bg-emerald-400 dark:bg-emerald-500"></span>
          <span>${escapeHtml(message)}</span>
        `;
        toastContainer.appendChild(toastEl);

        setTimeout(() => {
          toastEl.style.opacity = '0';
          toastEl.style.transform = 'translateY(8px)';
          toastEl.style.transition = 'all 200ms ease';
          setTimeout(() => toastEl.remove(), 220);
        }, 2600);
      }

      // Update Progress Bar & Counters
      function updateProgressUI() {
        const total = todos.length;
        const completed = todos.filter(t => t.completed).length;
        const pct = total === 0 ? 0 : Math.round((completed / total) * 100);

        completionBadge.textContent = `${pct}%`;
        completionBadge.className = `px-2 py-0.5 text-xs font-bold rounded-full ${
          pct === 100 && total > 0
            ? 'bg-emerald-500 text-white'
            : 'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400'
        }`;
        taskCounter.textContent = `${completed} of ${total} tasks completed`;
        progressBarFill.style.width = `${pct}%`;
      }

      // Render Single Task Row (View Mode)
      function renderTodoItemHTML(todo) {
        const overdue = isOverdue(todo.dueDate, todo.completed);
        const formattedDate = formatDueDate(todo.dueDate);

        return `
          <div id="${todo.id}" data-id="${todo.id}" class="todo-item group animate-slide-in flex items-center justify-between gap-3 p-3.5 sm:p-4 rounded-2xl bg-white/90 dark:bg-slate-900/75 hover:bg-white dark:hover:bg-slate-900 border ${todo.completed ? 'border-slate-200/50 dark:border-slate-800/50 opacity-75' : 'border-slate-200/80 dark:border-slate-800/80 shadow-sm'} backdrop-blur-md">
            
            <!-- Left: Checkbox & Task Details -->
            <div class="flex items-start sm:items-center gap-3.5 flex-1 min-w-0">
              <button 
                type="button"
                data-action="toggle"
                aria-label="Toggle task completion"
                class="mt-0.5 sm:mt-0 w-6 h-6 rounded-full flex items-center justify-center shrink-0 transition-all cursor-pointer ${
                  todo.completed 
                    ? 'bg-gradient-to-br from-emerald-500 to-teal-500 text-white shadow-sm shadow-emerald-500/30 animate-pop' 
                    : 'border-2 border-slate-300 dark:border-slate-600 hover:border-indigo-500 dark:hover:border-indigo-400 bg-transparent'
                }">
                ${todo.completed ? `
                  <svg class="w-3.5 h-3.5 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                  </svg>
                ` : ''}
              </button>

              <!-- Title & Metadata Badges -->
              <div class="flex-1 min-w-0">
                <p 
                  data-action="edit"
                  title="Click to edit"
                  class="text-sm sm:text-[15px] font-medium leading-snug cursor-pointer transition-all break-words ${
                    todo.completed 
                      ? 'line-through text-slate-400 dark:text-slate-500' 
                      : 'text-slate-800 dark:text-slate-100 group-hover:text-indigo-600 dark:group-hover:text-indigo-300'
                  }">
                  ${escapeHtml(todo.title)}
                </p>

                <!-- Badges Row -->
                <div class="flex flex-wrap items-center gap-2 mt-1.5">
                  ${getPriorityBadge(todo.priority)}
                  ${getCategoryBadge(todo.category)}
                  
                  ${formattedDate ? `
                    <span class="inline-flex items-center gap-1 text-[11px] font-medium ${overdue ? 'text-rose-500 font-semibold' : 'text-slate-400 dark:text-slate-500'}">
                      <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                      </svg>
                      ${overdue ? 'Overdue · ' : ''}${escapeHtml(formattedDate)}
                    </span>
                  ` : ''}
                </div>
              </div>
            </div>

            <!-- Right: Hover / Touch Action Buttons -->
            <div class="flex items-center gap-1 sm:opacity-0 sm:group-hover:opacity-100 focus-within:opacity-100 transition-opacity shrink-0">
              <button 
                type="button"
                data-action="edit"
                title="Edit task"
                class="p-2 rounded-xl text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-indigo-500/10 transition-all cursor-pointer">
                <svg class="w-4 h-4 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                </svg>
              </button>

              <button 
                type="button"
                data-action="delete"
                title="Delete task"
                class="p-2 rounded-xl text-slate-400 hover:text-rose-600 dark:hover:text-rose-400 hover:bg-rose-500/10 transition-all cursor-pointer">
                <svg class="w-4 h-4 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
              </button>
            </div>
          </div>
        `;
      }

      // Render Inline Edit Form for a Task
      function renderEditFormHTML(todo) {
        return `
          <form 
            id="${todo.id}"
            data-id="${todo.id}"
            data-edit-form="true"
            class="p-4 rounded-2xl bg-white dark:bg-slate-900 border-2 border-indigo-500/70 shadow-lg space-y-3 animate-slide-in">
            
            <div>
              <input 
                type="text" 
                name="title" 
                value="${escapeHtml(todo.title)}" 
                required
                class="edit-title-input w-full px-3.5 py-2 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-sm font-medium text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
              />
            </div>

            <div class="flex flex-wrap items-center justify-between gap-2">
              <div class="flex flex-wrap items-center gap-2">
                <select name="priority" class="px-2.5 py-1.5 rounded-lg bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-xs font-medium text-slate-700 dark:text-slate-300">
                  <option value="High" ${todo.priority === 'High' ? 'selected' : ''}>🔴 High</option>
                  <option value="Medium" ${todo.priority === 'Medium' ? 'selected' : ''}>🟡 Medium</option>
                  <option value="Low" ${todo.priority === 'Low' ? 'selected' : ''}>🔵 Low</option>
                </select>

                <select name="category" class="px-2.5 py-1.5 rounded-lg bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-xs font-medium text-slate-700 dark:text-slate-300">
                  <option value="Work" ${todo.category === 'Work' ? 'selected' : ''}>💼 Work</option>
                  <option value="Design" ${todo.category === 'Design' ? 'selected' : ''}>🎨 Design</option>
                  <option value="Personal" ${todo.category === 'Personal' ? 'selected' : ''}>🏠 Personal</option>
                  <option value="Urgent" ${todo.category === 'Urgent' ? 'selected' : ''}>⚡ Urgent</option>
                </select>

                <input 
                  type="date" 
                  name="dueDate" 
                  value="${escapeHtml(todo.dueDate || '')}"
                  class="px-2.5 py-1.5 rounded-lg bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-xs font-medium text-slate-700 dark:text-slate-300"
                />
              </div>

              <div class="flex items-center gap-2 ml-auto">
                <button 
                  type="button"
                  data-action="cancel-edit"
                  class="px-3 py-1.5 rounded-lg text-xs font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all cursor-pointer">
                  Cancel
                </button>
                <button 
                  type="submit"
                  class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white shadow-sm transition-all cursor-pointer">
                  Save Changes
                </button>
              </div>
            </div>
          </form>
        `;
      }

      // Master Render Function
      function renderApp() {
        updateProgressUI();

        const filtered = todos.filter(todo => {
          if (currentFilter === 'active' && todo.completed) return false;
          if (currentFilter === 'completed' && !todo.completed) return false;
          if (currentFilter === 'high' && todo.priority !== 'High') return false;

          if (currentSearch.trim() !== '') {
            const q = currentSearch.toLowerCase();
            const matchTitle = todo.title.toLowerCase().includes(q);
            const matchCat = todo.category.toLowerCase().includes(q);
            const matchPrio = todo.priority.toLowerCase().includes(q);
            if (!matchTitle && !matchCat && !matchPrio) return false;
          }
          return true;
        });

        if (filtered.length === 0) {
          todoListEl.innerHTML = `
            <div class="py-12 px-4 text-center rounded-2xl bg-white/50 dark:bg-slate-900/40 border border-dashed border-slate-300 dark:border-slate-800 animate-slide-in">
              <div class="w-12 h-12 mx-auto mb-3 rounded-2xl bg-indigo-500/10 text-indigo-500 flex items-center justify-center">
                <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                </svg>
              </div>
              <h3 class="text-sm font-semibold text-slate-800 dark:text-slate-200">No matching tasks found</h3>
              <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 max-w-xs mx-auto">
                ${currentSearch ? 'Try clearing your search query or switching filter tabs.' : 'Add a new task above to get started on your goals!'}
              </p>
            </div>
          `;
          return;
        }

        todoListEl.innerHTML = filtered
          .map(todo => (todo.id === editingId ? renderEditFormHTML(todo) : renderTodoItemHTML(todo)))
          .join('');

        // Focus edit input if currently editing
        if (editingId) {
          const input = todoListEl.querySelector('.edit-title-input');
          if (input) {
            input.focus();
            input.setSelectionRange(input.value.length, input.value.length);
          }
        }
      }

      // Update Filter Tab Active Visuals
      function updateActiveTabUI(activeFilter) {
        document.querySelectorAll('.filter-tab').forEach(btn => {
          const isMatch = btn.dataset.filter === activeFilter;
          btn.className = isMatch
            ? 'filter-tab px-3 py-1.5 rounded-lg text-xs font-semibold transition-all whitespace-nowrap bg-white dark:bg-slate-800 text-indigo-600 dark:text-indigo-400 shadow-sm cursor-pointer'
            : 'filter-tab px-3 py-1.5 rounded-lg text-xs font-medium text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all whitespace-nowrap cursor-pointer';
        });
      }

      // Event Listeners

      // 1. Add New Task
      newTodoForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const formData = new FormData(newTodoForm);
        const title = (formData.get('title') || '').trim();
        if (!title) return;

        const newTodo = {
          id: 'todo-' + Date.now(),
          title,
          priority: formData.get('priority') || 'Medium',
          category: formData.get('category') || 'Work',
          dueDate: formData.get('dueDate') || '',
          completed: false,
          createdAt: Date.now()
        };

        todos.unshift(newTodo);
        saveTodos();
        newTodoForm.reset();
        renderApp();
        showToast('Task added!');
      });

      // 2. Delegated Click Actions on Task List (Toggle, Edit, Cancel Edit, Delete)
      todoListEl.addEventListener('click', (e) => {
        const actionEl = e.target.closest('[data-action]');
        if (!actionEl) return;

        const itemEl = actionEl.closest('[data-id]');
        if (!itemEl) return;

        const id = itemEl.dataset.id;
        const action = actionEl.dataset.action;
        const index = todos.findIndex(t => t.id === id);
        if (index === -1) return;

        if (action === 'toggle') {
          todos[index].completed = !todos[index].completed;
          saveTodos();
          renderApp();
          showToast(todos[index].completed ? 'Task completed! 🎉' : 'Task marked active');
        } else if (action === 'edit') {
          editingId = id;
          renderApp();
        } else if (action === 'cancel-edit') {
          editingId = null;
          renderApp();
        } else if (action === 'delete') {
          itemEl.classList.add('item-removing');
          setTimeout(() => {
            todos = todos.filter(t => t.id !== id);
            if (editingId === id) editingId = null;
            saveTodos();
            renderApp();
            showToast('Task deleted');
          }, 210);
        }
      });

      // 3. Delegated Inline Edit Form Submission
      todoListEl.addEventListener('submit', (e) => {
        const form = e.target.closest('form[data-edit-form="true"]');
        if (!form) return;
        e.preventDefault();

        const id = form.dataset.id;
        const index = todos.findIndex(t => t.id === id);
        if (index === -1) return;

        const formData = new FormData(form);
        const updatedTitle = (formData.get('title') || '').trim();
        if (updatedTitle) {
          todos[index].title = updatedTitle;
          todos[index].priority = formData.get('priority') || todos[index].priority;
          todos[index].category = formData.get('category') || todos[index].category;
          todos[index].dueDate = formData.get('dueDate') || '';
          saveTodos();
        }

        editingId = null;
        renderApp();
        showToast('Task updated');
      });

      // 4. Filter Tab Switching
      filterTabsContainer.addEventListener('click', (e) => {
        const tab = e.target.closest('.filter-tab');
        if (!tab) return;
        currentFilter = tab.dataset.filter;
        editingId = null;
        updateActiveTabUI(currentFilter);
        renderApp();
      });

      // 5. Live Search
      searchInput.addEventListener('input', (e) => {
        currentSearch = e.target.value;
        renderApp();
      });

      // 6. Clear Completed Tasks
      clearCompletedBtn.addEventListener('click', () => {
        const initialCount = todos.length;
        todos = todos.filter(t => !t.completed);
        const removedCount = initialCount - todos.length;

        if (removedCount > 0) {
          saveTodos();
          renderApp();
          showToast(`Cleared ${removedCount} completed task${removedCount > 1 ? 's' : ''}`);
        } else {
          showToast('No completed tasks to clear');
        }
      });

      // 7. Reset Demo Data
      resetDemoBtn.addEventListener('click', () => {
        todos = getDefaultTodos();
        saveTodos();
        currentFilter = 'all';
        currentSearch = '';
        editingId = null;
        searchInput.value = '';
        updateActiveTabUI('all');
        renderApp();
        showToast('Sample tasks restored');
      });

      // 8. Dark / Light Mode Toggle
      const htmlEl = document.documentElement;
      const savedTheme = localStorage.getItem('taskflow_theme');
      if (savedTheme === 'light') {
        htmlEl.classList.remove('dark');
      } else {
        htmlEl.classList.add('dark');
      }

      themeToggleBtn.addEventListener('click', () => {
        htmlEl.classList.toggle('dark');
        const isDark = htmlEl.classList.contains('dark');
        localStorage.setItem('taskflow_theme', isDark ? 'dark' : 'light');
      });

      // Initialize App
      todos = loadTodos();
      renderApp();
    })();
  </script>
</body>
</html>
